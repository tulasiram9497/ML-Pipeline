[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-ml-pipeline"
version = "0.1.0"
description = "Production-ready AutoML pipeline for classification, regression, and clustering tasks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI Engineering Team" }]
license = { text = "MIT" }
keywords = ["ml", "automl", "scikit-learn", "mlflow", "pipeline"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    "optuna>=3.3",
    "mlflow>=2.12",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.109",
    "pydantic>=2.6",
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
]

[project.optional-dependencies]
full = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "shap>=0.45",
]

[project.scripts]
ml-pipeline = "ml_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
